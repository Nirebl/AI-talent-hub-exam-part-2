services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_ai
      POSTGRES_USER: support_ai
      POSTGRES_PASSWORD: support_ai
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U support_ai -d support_ai
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://support_ai:support_ai@postgres:5432/support_ai
      PERSISTENCE_BACKEND: sqlalchemy
      QUEUE_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      LLM_BACKEND: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
    command:
      - celery
      - -A
      - support_ai.infrastructure.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=response_generation
      - --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://support_ai:support_ai@postgres:5432/support_ai
      PERSISTENCE_BACKEND: sqlalchemy
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      LLM_BACKEND: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
