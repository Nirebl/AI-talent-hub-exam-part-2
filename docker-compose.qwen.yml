services:
  api:
    environment:
      LLM_BACKEND: qwen
      KNOWLEDGE_BASE_PATH: /app/data/knowledge_base.json

  worker:
    build:
      context: .
      target: qwen-worker
    command:
      - celery
      - -A
      - support_ai.infrastructure.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=response_generation
      - --concurrency=1
    environment:
      LLM_BACKEND: qwen
      KNOWLEDGE_BASE_PATH: /app/data/knowledge_base.json
      QWEN_MODEL_ID: ${QWEN_MODEL_ID:-Qwen/Qwen3-4B-Instruct-2507}
      QWEN_LOAD_IN_4BIT: ${QWEN_LOAD_IN_4BIT:-true}
      QWEN_MAX_INPUT_TOKENS: ${QWEN_MAX_INPUT_TOKENS:-4096}
      QWEN_MAX_NEW_TOKENS: ${QWEN_MAX_NEW_TOKENS:-256}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

volumes:
  huggingface_cache:
